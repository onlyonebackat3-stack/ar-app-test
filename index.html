<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 과제용 프로젝트</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
    #capture-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: #ff4757;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #capture-btn:active { background: #ff6b81; transform: translateX(-50%) scale(0.95); }
  </style>
</head>
<body>
  <div id="ui-overlay">제품을 비추어 인식을 완료한 뒤,<br>원하는 위치에 고정된 캐릭터를 터치해 보세요!</div>
  <button id="capture-btn">📸 화면 캡처하기</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./target.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- WebM 투명 비디오 포맷으로 경로 지정 -->
      <video id="char-vid" src="./character.webm" preload="auto" loop autoplay muted playsinline></video>
      <video id="char-touch-vid" src="./character-touch.webm" preload="auto" loop autoplay muted playsinline></video>
      <audio id="char-sound" src="./sound.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-camera>

    <!-- 제품 인식 영역 (최초 인식 시 좌표 고정) -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-plane id="char-plane" class="clickable" material="src: #char-vid; transparent: true;" position="0 0 0" height="1" width="1" visible="false"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const arTarget = document.querySelector('#ar-target');
      const charPlane = document.querySelector('#char-plane');
      const charVid = document.querySelector('#char-vid');
      const charTouchVid = document.querySelector('#char-touch-vid');
      const sound = document.querySelector('#char-sound');
      const captureBtn = document.querySelector('#capture-btn');

      let isLocked = false;       
      let isInteracting = false;  

      // 1. 제품 사진 인식 순간 위치 고정 및 캐릭터 등장
      arTarget.addEventListener('targetFound', () => {
        if (!isLocked) {
          isLocked = true;
          charPlane.setAttribute('visible', 'true');
          charVid.play();
        }
      });

      // 2. 캐릭터 터치 시 상호작용 (터치 비디오 및 효과음 재생)
      charPlane.addEventListener('click', (evt) => {
        evt.stopPropagation();
        if (isInteracting || !isLocked) return;
        isInteracting = true;

        charPlane.setAttribute('material', 'src', '#char-touch-vid');
        charTouchVid.currentTime = 0;
        charTouchVid.play();

        sound.currentTime = 0;
        sound.play().catch(e => console.log("사운드 재생 제한:", e));

        const soundDuration = (sound.duration && !isNaN(sound.duration)) ? sound.duration * 1000 : 3000;
        setTimeout(() => {
          charPlane.setAttribute('material', 'src', '#char-vid');
          isInteracting = false;
        }, soundDuration);
      });

      // 3. 캡처 버튼 기능
      captureBtn.addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        sceneEl.renderer.preserveDrawingBuffer = true; 

        setTimeout(() => {
          const canvas = sceneEl.renderer.domElement;
          const imageURL = canvas.toDataURL('image/png');

          const downloadLink = document.createElement('a');
          downloadLink.href = imageURL;
          downloadLink.download = 'AR_Capture.png';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
        }, 100);
      });
    });
  </script>
</body>
</html>
