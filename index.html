<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 과제용 프로젝트</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui-overlay {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; background: rgba(0, 0, 0, 0.7); color: white;
      padding: 10px 20px; border-radius: 20px; font-family: sans-serif;
      font-size: 14px; pointer-events: none; text-align: center;
    }
    /* 화면 중앙에 띄울 투명 비디오 스타일 (터치 가능) */
    #ar-video-container {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 250px; height: 250px;
      z-index: 5; display: none; /* 초기에는 숨김 */
      pointer-events: auto;
    }
    #ar-video-container video {
      width: 100%; height: 100%; object-fit: contain;
      background: transparent; /* 검은 배경 차단 */
    }
    #capture-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: #ff4757; color: white; border: none;
      padding: 15px 30px; border-radius: 30px; font-size: 16px;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="ui-overlay">제품을 비추어 인식을 완료한 뒤,<br>화면에 나타난 캐릭터를 터치해 보세요!</div>
  
  <!-- HTML 화면에 직접 띄우는 투명 비디오 영역 -->
  <div id="ar-video-container">
    <video id="char-video" src="./character.webm" loop muted playsinline></video>
  </div>

  <button id="capture-btn">📸 화면 캡처하기</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./target.mind;" 
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: none"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const arTarget = document.querySelector('#ar-target');
      const videoContainer = document.querySelector('#ar-video-container');
      const charVideo = document.querySelector('#char-video');
      const sound = new Audio('./sound.mp3'); // 효과음 객체
      const captureBtn = document.querySelector('#capture-btn');

      let isLocked = false;
      let isInteracting = false;

      // 1. 제품 인식 순간 위치 고정 및 비디오 등장
      arTarget.addEventListener('targetFound', () => {
        if (!isLocked) {
          isLocked = true;
          videoContainer.style.display = 'block'; // 비디오 화면에 표시
          charVideo.play().catch(e => console.log("자동재생 제한:", e));
        }
      });

      // 2. 캐릭터 터치 시 (비디오 소스 변경 및 사운드 재생)
      charVideo.addEventListener('click', () => {
        if (isInteracting || !isLocked) return;
        isInteracting = true;

        // 터치용 비디오로 교체
        charVideo.src = './character-touch.webm';
        charVideo.play();

        // 사운드 재생
        sound.currentTime = 0;
        sound.play().catch(e => console.log("사운드 제한:", e));

        // 사운드 종료 후 원래 비디오로 복귀 (약 3초 또는 사운드 길이)
        setTimeout(() => {
          charVideo.src = './character.webm';
          charVideo.play();
          isInteracting = false;
        }, 3000);
      });

      // 3. 캡처 기능
      captureBtn.addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        sceneEl.renderer.preserveDrawingBuffer = true;
        setTimeout(() => {
          const canvas = sceneEl.renderer.domElement;
          const imageURL = canvas.toDataURL('image/png');
          const downloadLink = document.createElement('a');
          downloadLink.href = imageURL;
          downloadLink.download = 'AR_Capture.png';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
        }, 100);
      });
    });
  </script>
</body>
</html>
