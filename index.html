<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 과제용 프로젝트</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    #ui-overlay {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; background: rgba(0, 0, 0, 0.7); color: white;
      padding: 10px 20px; border-radius: 20px; font-family: sans-serif;
      font-size: 14px; pointer-events: none; text-align: center;
    }
    /* 화면 중앙에 고정되는 비디오 컨테이너 */
    #ar-video-container {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 250px; height: 250px;
      z-index: 5; display: none;
      pointer-events: auto;
      cursor: pointer;
    }
    /* 두 개의 비디오를 겹쳐서 대기시킴 (깜빡임 방지 핵심) */
    #ar-video-container video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: contain;
      background: transparent;
      display: none; /* 평상시엔 숨김 */
    }
    #capture-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: #ff4757; color: white; border: none;
      padding: 15px 30px; border-radius: 30px; font-size: 16px;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #capture-btn:active { background: #ff6b81; transform: translateX(-50%) scale(0.95); }
  </style>
</head>
<body>
  <div id="ui-overlay">제품을 비추어 인식을 완료한 뒤,<br>화면에 나타난 캐릭터를 터치해 보세요!</div>
  
  <!-- 두 비디오를 미리 로드해 두고 스위칭합니다 -->
  <div id="ar-video-container">
    <video id="char-video-idle" src="./character.webm" loop muted playsinline></video>
    <video id="char-video-touch" src="./character-touch.webm" muted
