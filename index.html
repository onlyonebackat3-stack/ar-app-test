<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 과제용 프로젝트</title>
  <!-- A-Frame 및 MindAR 라이브러리 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    /* 안내 문구 UI */
    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
    /* 화면 중앙에 띄울 투명 비디오 컨테이너 */
    #ar-video-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      z-index: 50;
      display: none;
      pointer-events: auto;
      cursor: pointer;
    }
    #ar-video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      transition: opacity 0.08s ease;
    }
    #char-video-idle { opacity: 1; z-index: 2; }
    #char-video-touch { opacity: 0; z-index: 1; pointer-events: none; }
  </style>
</head>
<body>

  <div id="ui-overlay">제품 사진을 비추어 인식해 주세요!</div>

  <!-- 투명 비디오 영역 (평상시 / 터치시) -->
  <div id="ar-video-container">
    <video id="char-video-idle" src="./character.webm" loop muted playsinline crossorigin="anonymous"></video>
    <video id="char-video-touch" src="./character-touch.webm" loop muted playsinline crossorigin="anonymous"></video>
  </div>

  <!-- MindAR 순정 뼈대 씬 (카메라 출력을 방해하는 불필요한 렌더러 옵션 제거) -->
  <a-scene 
    id="ar-scene"
    mindar-image="imageTargetSrc: ./target.mind; uiLoading: yes; uiError: yes; uiScanning: yes;" 
    color-space="sRGB" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: none"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('#ar-scene');
      const arTarget = document.querySelector('#ar-target');
      const uiOverlay = document.querySelector('#ui-overlay');
      const videoContainer = document.querySelector('#ar-video-container');
      const videoIdle = document.querySelector('#char-video-idle');
      const videoTouch = document.querySelector('#char-video-touch');

      const sound = new Audio('./sound.mp3');
      sound.preload = 'auto';

      let isLocked = false;
      let isInteracting = false;

      // 1. 제품 인식 순간: 카메라 스트림은 건드리지 않고 트래킹만 일시정지 후 캐릭터 중앙 고정
      arTarget.addEventListener('targetFound', () => {
        if (isLocked) return;
        isLocked = true;

        const mindarSystem = sceneEl.systems['mindar-image-system'];
        if (mindarSystem && typeof mindarSystem.pause === 'function') {
          mindarSystem.pause(true); // 카메라 유지 + 인식 정지
        }

        videoContainer.style.display = 'block';
        videoIdle.play().catch(e => console.log("기본 비디오 재생 대기:", e));
        videoTouch.play().catch(e => console.log("터치 비디오 로드 대기:", e));

        uiOverlay.textContent = '캐릭터를 터치해 보세요!';
        setTimeout(() => { uiOverlay.style.display = 'none'; }, 2500);
      });

      // 2. 캐릭터 터치 시: 깜빡임 없이 터치 모션 + 사운드 재생 후 복구
      videoContainer.addEventListener('click', () => {
        if (!isLocked || isInteracting) return;
        isInteracting = true;

        videoTouch.currentTime = 0;
        videoTouch.play().catch(e => console.log(e));

        videoTouch.style.opacity = '1';
        videoTouch.style.zIndex = '2';
        videoIdle.style.opacity = '0';
        videoIdle.style.zIndex = '1';

        sound.currentTime = 0;
        sound.play().catch(e => console.log(e));

        const duration = (sound.duration && !isNaN(sound.duration)) ? sound.duration * 1000 : 3000;
        setTimeout(() => {
          videoIdle.play().catch(() => {});
          videoIdle.style.opacity = '1';
          videoIdle.style.zIndex = '2';
          videoTouch.style.opacity = '0';
          videoTouch.style.zIndex = '1';
          isInteracting = false;
        }, duration);
      });
    });
  </script>
</body>
</html>
