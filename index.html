<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 과제용 프로젝트</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    #ui-overlay {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; background: rgba(0, 0, 0, 0.7); color: white;
      padding: 10px 20px; border-radius: 20px; font-family: sans-serif;
      font-size: 14px; pointer-events: none; text-align: center;
    }
    /* 화면 중앙에 고정되는 비디오 컨테이너 */
    #ar-video-container {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 250px; height: 250px;
      z-index: 5; display: none;
      pointer-events: auto;
      cursor: pointer;
    }
    /* 두 개의 비디오를 겹쳐서 대기시킴 (깜빡임 방지 핵심) */
    #ar-video-container video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: contain;
      background: transparent;
      display: none; /* 평상시엔 숨김 */
    }
    #capture-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: #ff4757; color: white; border: none;
      padding: 15px 30px; border-radius: 30px; font-size: 16px;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #capture-btn:active { background: #ff6b81; transform: translateX(-50%) scale(0.95); }
  </style>
</head>
<body>
  <div id="ui-overlay">제품을 비추어 인식을 완료한 뒤,<br>화면에 나타난 캐릭터를 터치해 보세요!</div>
  
  <!-- 두 비디오를 미리 로드해 두고 스위칭합니다 -->
  <div id="ar-video-container">
    <video id="char-video-idle" src="./character.webm" loop muted playsinline></video>
    <video id="char-video-touch" src="./character-touch.webm" muted playsinline></video>
  </div>

  <button id="capture-btn">📸 화면 캡처하기</button>

  <a-scene 
    id="ar-scene"
    mindar-image="imageTargetSrc: ./target.mind;" 
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <!-- 카메라 정상 작동하도록 배치 -->
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: none"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('#ar-scene');
      const arTarget = document.querySelector('#ar-target');
      const videoContainer = document.querySelector('#ar-video-container');
      const videoIdle = document.querySelector('#char-video-idle');
      const videoTouch = document.querySelector('#char-video-touch');
      const sound = new Audio('./sound.mp3');
      const captureBtn = document.querySelector('#capture-btn');

      let isLocked = false;
      let isInteracting = false;

      // 1. 제품 인식 순간: 트래킹 정지 및 기본 비디오 재생
      arTarget.addEventListener('targetFound', () => {
        if (!isLocked) {
          isLocked = true;
          
          if (sceneEl.systems['mindar-image-system']) {
            sceneEl.systems['mindar-image-system'].stop(); // 트래킹 고정
          }

          videoContainer.style.display = 'block';
          videoIdle.style.display = 'block'; // 기본 비디오 노출
          videoIdle.play().catch(e => console.log("자동재생 제한:", e));
          
          document.querySelector('#ui-overlay').style.display = 'none';
        }
      });

      // 2. 캐릭터 터치 시: 깜빡임 없이 즉시 터치 비디오로 스위치 + 사운드 재생
      videoContainer.addEventListener('click', () => {
        if (isInteracting || !isLocked) return;
        isInteracting = true;

        // 기존 기본 비디오 숨기고 정지, 터치 비디오 즉시 표출 및 재생
        videoIdle.style.display = 'none';
        videoIdle.pause();

        videoTouch.style.display = 'block';
        videoTouch.currentTime = 0;
        videoTouch.play().catch(e => console.log("터치 비디오 재생 제한:", e));

        sound.currentTime = 0;
        sound.play().catch(e => console.log("사운드 제한:", e));

        // 사운드 재생 완료 후 (또는 약 3초 뒤) 다시 부드럽게 기본 비디오로 복귀
        const soundDuration = (sound.duration && !isNaN(sound.duration)) ? sound.duration * 1000 : 3000;
        setTimeout(() => {
          videoTouch.style.display = 'none';
          videoTouch.pause();

          videoIdle.style.display = 'block';
          videoIdle.play();
          isInteracting = false;
        }, soundDuration);
      });

      // 3. 캡처 기능 (카메라 화면 + AR 캔버스 합성 다운로드)
      captureBtn.addEventListener('click', () => {
        const canvas = sceneEl.renderer.domElement;
        sceneEl.renderer.preserveDrawingBuffer = true;

        setTimeout(() => {
          const imageURL = canvas.toDataURL('image/png');
          const downloadLink = document.createElement('a');
          downloadLink.href = imageURL;
          downloadLink.download = 'AR_Capture.png';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
        }, 100);
      });
    });
  </script>
</body>
</html>
